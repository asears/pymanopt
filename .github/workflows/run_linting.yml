name: Run linting

on:
  pull_request:
    branches:
      - master

jobs:
  linting:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version to 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: 3.12

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: uv pip install -e ".[dev,ci]"

      - name: Run linting
        run: |
          ruff check .
          ruff format --check .
